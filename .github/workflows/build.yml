name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same ref makes the older build pointless, so stop it.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  neoforge-1_21_1:
    name: NeoForge 1.21.1
    if: "! contains(toJSON(github.event.commits.*.message), '[ci skip]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@v6
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew forge-1.20.1/gradlew
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: ./gradlew build
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ae2things-neoforge-1.21.1
          path: build/libs/

  forge-1_20_1:
    name: Forge 1.20.1
    if: "! contains(toJSON(github.event.commits.*.message), '[ci skip]')"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forge-1.20.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: ./gradlew build
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ae2things-forge-1.20.1
          path: forge-1.20.1/build/libs/
