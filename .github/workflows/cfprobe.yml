name: CFProbe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      T: ${{ secrets.CURSEFORGE_TOKEN }}
    steps:
      - name: Probe
        run: |
          set -u
          B=https://minecraft.curseforge.com
          echo "== GET /api/projects/1729932 (with token)"
          curl -sS -o /tmp/a -w 'code=%{http_code}\n' -H "X-Api-Token: $T" "$B/api/projects/1729932"; head -c 400 /tmp/a; echo
          echo "== GET /api/projects/1729932 (no token)"
          curl -sS -o /tmp/a2 -w 'code=%{http_code}\n' "$B/api/projects/1729932"; head -c 200 /tmp/a2; echo
          echo "== GET /api/game/versions (no token) -- is auth even needed?"
          curl -sS -o /dev/null -w 'code=%{http_code}\n' "$B/api/game/versions"
          echo "== POST uploadFile metadata only"
          curl -sS -o /tmp/b -w 'code=%{http_code}\n' -X POST -H "X-Api-Token: $T" -F 'metadata={"displayName":"probe","releaseType":"alpha","gameVersions":[11779]}' "$B/api/projects/1729932/uploadFile"; head -c 300 /tmp/b; echo
          echo "== POST uploadFile with real jar, verbose headers"
          curl -sS -o /tmp/c -D /tmp/ch -w 'code=%{http_code}\n' -X POST -H "X-Api-Token: $T" -F 'metadata={"displayName":"probe","releaseType":"alpha","gameVersions":[11779]}' -F "file=@/etc/hostname;filename=probe.jar;type=application/java-archive" "$B/api/projects/1729932/uploadFile"
          grep -iE 'HTTP/|location|content-type|cf-ray|server' /tmp/ch | tr -d '\r' | head -8
          head -c 300 /tmp/c; echo