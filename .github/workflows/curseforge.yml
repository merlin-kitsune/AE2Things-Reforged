name: CurseForge

# Uploads an already published release asset to CurseForge.
#
# Why a workflow and not a local run: CurseForge sits behind Cloudflare, which refuses
# this project's local network with "403 Just a moment..." while runner traffic is
# accepted. The asset is downloaded from the GitHub release, so what lands on
# CurseForge is exactly the jar that was built and tested, not a fresh rebuild.
#
#   gh workflow run curseforge.yml -f line=neoforge -f description=true
#   gh workflow run curseforge.yml -f line=forge
on:
  workflow_dispatch:
    inputs:
      line:
        description: Which line to upload
        type: choice
        options: [neoforge, forge]
        default: neoforge
      description:
        description: Also push docs/curseforge/DESCRIPTION.md as the project page
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      CURSEFORGE_PROJECT: "1729932"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve the release, the version and the loader
        run: |
          set -euo pipefail
          if [ "${{ inputs.line }}" = "forge" ]; then
            VERSION="$(grep -E '^mod_version=' forge-1.20.1/gradle.properties | cut -d= -f2)"
            echo "TAG=forge-${VERSION}" >> "$GITHUB_ENV"
            echo "MC=1.20.1" >> "$GITHUB_ENV"
            echo "LOADER=forge" >> "$GITHUB_ENV"
            echo "LABEL=Forge 1.20.1" >> "$GITHUB_ENV"
          else
            VERSION="$(grep -E '^mod_version=' gradle.properties | cut -d= -f2)"
            echo "TAG=${VERSION}" >> "$GITHUB_ENV"
            echo "MC=1.21.1" >> "$GITHUB_ENV"
            echo "LOADER=neoforge" >> "$GITHUB_ENV"
            echo "LABEL=NeoForge 1.21.1" >> "$GITHUB_ENV"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
      - name: Download the published jar
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --pattern "AE2-Things-${VERSION}.jar" --dir dist
          sha256sum "dist/AE2-Things-${VERSION}.jar"
      - name: Upload to CurseForge
        run: |
          set -euo pipefail
          python3 tools/curseforge_upload.py --project "$CURSEFORGE_PROJECT" \
            --file "dist/AE2-Things-${VERSION}.jar" --mc "$MC" --loader "$LOADER" \
            --changelog-file "docs/curseforge/CHANGELOG-${VERSION}.md" \
            --display-name "AE2 Things Reforged ${VERSION} (${LABEL})"
      - name: Push the project page description
        if: ${{ inputs.description }}
        run: |
          python3 tools/curseforge_upload.py --project "$CURSEFORGE_PROJECT" \
            --description-file docs/curseforge/DESCRIPTION.md
