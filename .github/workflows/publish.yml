name: Publish

# Release tags are namespaced by line, because each line has its own version number:
#   forge-<version>     -> the Forge 1.20.1 line   (for example "forge-1.3.0")
#   <version>           -> the NeoForge 1.21.1 line (the historical form, e.g. "1.4.3")
#   neoforge-<version>  -> the NeoForge 1.21.1 line (explicit form)
# The uploaded asset is always AE2-Things-<version>.jar, with the line prefix stripped from the tag.
on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  publish-neoforge:
    name: Publish NeoForge 1.21.1
    if: ${{ ! startsWith(github.event.release.tag_name, 'forge-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Resolve version from tag
        run: |
          VERSION="${TAG#neoforge-}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
        env:
          TAG: ${{ github.event.release.tag_name }}
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: ./gradlew build -Pmod_version="$VERSION"
      - name: Upload Release Artifact
        run: gh release upload "$TAG" "./build/libs/AE2-Things-$VERSION.jar" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}

  publish-forge:
    name: Publish Forge 1.20.1
    if: ${{ startsWith(github.event.release.tag_name, 'forge-') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forge-1.20.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Resolve version from tag
        run: |
          VERSION="${TAG#forge-}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
        env:
          TAG: ${{ github.event.release.tag_name }}
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: ./gradlew build -Pmod_version="$VERSION"
      - name: Upload Release Artifact
        run: gh release upload "$TAG" "./build/libs/AE2-Things-$VERSION.jar" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
