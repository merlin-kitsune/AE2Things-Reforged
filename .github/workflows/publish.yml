name: Publish

# The release tag has to be the plain mod version (for example "1.4.3", not "1.4.3-reforged"),
# because the artifact that is uploaded is build/libs/AE2-Things-<tag>.jar.
on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build
        env:
          AE2THINGS_VERSION: ${{ github.event.release.tag_name }}
      - name: Upload Release Artifact
        run: gh release upload "${{ github.event.release.tag_name }}" "./build/libs/AE2-Things-${{ github.event.release.tag_name }}.jar" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}