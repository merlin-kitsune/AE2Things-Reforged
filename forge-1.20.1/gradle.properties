# ---- AE2Things Reforged / Minecraft 1.20.1 Forge 线 ----
# AE2 固定 15.4.12(1.20.1 Forge 最新版);Forge API 版本 = AE2 15.4.12 自身编译所用版本 47.1.47,
# 其 mods.toml 声明 forge [47.1.3,) 为最低支持,故本模组以 47.1.47 编译、以 [47.1.3,) 声明。
mod_version=1.3.1
mod_group_id=io.github.merlin-kitsune
mod_id=ae2things
mod_name=AE2 Things Reforged
mod_license=MIT

minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.20.2)
forge_version=1.20.1-47.1.47

# AE2:坐标用 Modrinth 的 **版本 id**(QRpVsqDI),不能用版本号 15.4.12 ——
# Modrinth 上该版本号的主文件是 **Fabric** jar(实测 9,828,296 B),版本 id 才指向 Forge jar(8,501,298 B)。
ae2_version=15.4.12
ae2_version_id=QRpVsqDI
ae2_version_range=[15.4.12,16.0.0)

# GuideME:AE2 15.4.12 把它声明为 mandatory [20.1.7,20.2.0),且**不**内嵌(其 jar 无 META-INF/jarjar)。
# 仅运行时需要(本模组不引用其 API),故用 modRuntimeOnly。
guideme_version=20.1.15
guideme_version_id=i7Tp1AHw

parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03

org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
